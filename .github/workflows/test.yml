name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Adafruit_DHT builds a Raspberry Pi C extension and refuses to
          # install anywhere else. The app already treats that library as
          # optional (DHT_ENABLE logs a warning and continues), and the
          # suite does not import it.
          grep -v '^Adafruit_DHT==' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install pytest
      - name: Run tests
        run: pytest
