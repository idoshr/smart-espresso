name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm reads the git history to write the package version.
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python - <<'PY'
          import importlib.util
          import sys

          import flask
          import PIL
          import requests

          blocked = (
              "gpiozero",
              "luma",
              "adafruit_dht",
              "Adafruit_DHT",
              "RPi",
              "spidev",
              "adafruit_ads1x15",
              "board",
              "busio",
          )
          found = []
          for name in blocked:
              try:
                  spec = importlib.util.find_spec(name)
              except (ModuleNotFoundError, ValueError):
                  spec = None
              if spec is not None:
                  found.append(name)
          if found:
              sys.exit("core install includes Pi libraries: " + ", ".join(found))
          print("core dependencies installed without Pi libraries")
          print(flask.__name__, PIL.__name__, requests.__name__)
          PY
      - name: Install test and device libraries
        run: pip install -e ".[test,pi]"
      - name: Run tests
        run: pytest --cov=smart_espresso --cov-report=term-missing --cov-fail-under=90
