[project]
name = "smart-espresso"
description = "Smart espresso machine using a Raspberry Pi 4 and a few sensors."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD 3-Clause License"}
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

keywords = [
  "espresso",
  "raspberrypi",
  "coffee",
]
authors = [
  {name = "Ido Shraga", email = "idoshraga@gmail.com"},
]
maintainers = [
  {name = "Ido Shraga", email = "idoshraga@gmail.com"}
]
dynamic = ["version"]

# Core install is the web stack. Pi ADC, GPIO and OLED drivers are the
# ``pi`` extra. ``dht`` is separate: adafruit-circuitpython-dht is imported
# only when a DHT22 is constructed, and it needs Pi GPIO (Blinka / libgpiod).
dependencies = [
  "Flask==3.1.3",
  "Pillow==13.0.0",
  "requests==2.32.5",
]

[project.optional-dependencies]
pi = [
  "gpiozero==1.6.2",
  "luma.core==2.4.1",
  "luma.oled==3.13.0",
  "adafruit-circuitpython-ads1x15==2.2.24",
  "adafruit-blinka==8.47.0",
]
dht = [
  "adafruit-blinka==8.47.0",
  "adafruit-circuitpython-dht==4.0.12",
]
ha = [
  "requests==2.32.5",
]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/idoshr/smart-espresso"
Documentation = "https://github.com/idoshr/smart-espresso"
Repository = "https://github.com/idoshr/smart-espresso"
Changelog = "https://github.com/idoshr/smart-espresso/releases"

[build-system]
requires = [
  "setuptools>=45",
  "setuptools_scm[toml]>=6.3.1",
  "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false
platforms = ["any"]
packages=[
  "smart_espresso",
  "smart_espresso.analog_sensor",
  "smart_espresso.web",
]

[tool.setuptools.package-data]
"smart_espresso.web" = ["static/*"]

[tool.setuptools.dynamic]
version = {attr = "smart_espresso._version.version"}

[tool.setuptools_scm]
write_to = "smart_espresso/_version.py"

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.eggs
  | \.git
  | \.tox
  | \.venv
  | \.vscode
  | docs
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[tool.mypy]
ignore_missing_imports = true
exclude = ["smart_espresso/test/"]

[tool.coverage.run]
source = ["smart_espresso"]
omit = [
  "smart_espresso/test/*",
  "smart_espresso/_version.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
#addopts = "--cov=smart_espresso --cov-config=setup.cfg"
testpaths = ["smart_espresso/test"]
# pytest 9 imports tests without putting the repo root on sys.path.
# ``main.py`` lives there, and an editable install covers the package.
pythonpath = ["."]
filterwarnings = [
  "error",
  "ignore::ResourceWarning",
  "ignore::DeprecationWarning:smart_espress",
  "ignore::DeprecationWarning:tests",
  "ignore:.*deprecated and ignored since IPython.*:DeprecationWarning"
  ]
