<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed square with the cup inside the maskable safe zone (center 62%). -->
  <rect width="512" height="512" fill="#F7F8F5"/>
  <!-- steam, in the matcha of the boiler ring -->
  <path d="M225 96c-15 19 15 28 0 47M287 96c-15 19 15 28 0 47"
        fill="none" stroke="#ABCDB2" stroke-width="18" stroke-linecap="round"/>
  <!-- cup with handle, in the milk and ink of the page -->
  <path d="M148 182h216v66a108 108 0 0 1-108 108 108 108 0 0 1-108-108z"
        fill="#FEFEFD" stroke="#3D4640" stroke-width="16" stroke-linejoin="round"/>
  <path d="M364 206h22a36 36 0 0 1 0 72h-22"
        fill="none" stroke="#3D4640" stroke-width="16" stroke-linecap="round"/>
  <!-- crema sitting on the shot -->
  <rect x="164" y="198" width="184" height="32" rx="16" fill="#EDBB9B"/>
  <!-- saucer -->
  <path d="M176 396h160" fill="none" stroke="#3D4640" stroke-width="16" stroke-linecap="round"/>
</svg>
